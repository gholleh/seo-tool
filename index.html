<body>
<div class="top"><div><h1>SEO Keyword Intelligence</h1><p>Keyword Importance فقط بر اساس داده Search Console — بدون Opportunity و بدون بررسی اجرای محتوا</p></div><div class="badge">Fail-closed</div></div>
<div class="wrap">
<div class="tabs"><button class="tab on" data-tab="analysis">تحلیل</button><button class="tab" data-tab="settings">تنظیمات AI</button><button class="tab" data-tab="history">تاریخچه</button></div>

<section id="analysis" class="pane on">
<div class="grid g2">
<div class="card"><h3>فایل Search Console</h3><input id="file" type="file" accept=".xlsx,.xls"><div class="actions"><button id="dataBtn" class="btn green">فقط موتور داده</button><button id="fullBtn" class="btn primary">تحلیل کامل AI</button><button id="demoBtn" class="btn ghost">DEMO</button></div><div id="fileMeta" class="mini"></div></div>
<div class="card"><h3>Pipeline</h3><div id="pipe" class="pipe"></div></div>
</div>
<div id="err" class="err"></div><div id="out"></div>
</section>

<section id="settings" class="pane">
<div class="card"><h3>تنظیمات عمومی</h3><div class="grid g3"><label>Candidate limit<input id="cand" type="number" min="20" max="300" value="140"></label><label>N-gram cap<input id="ngcap" type="number" min="1" max="15" value="15"></label><label>Fail-closed<input value="همیشه فعال" disabled></label></div></div>
<div id="stageSettings"></div><button id="save" class="btn primary">ذخیره تنظیمات (API Key ذخیره نمی‌شود)</button>
</section>

<section id="history" class="pane"><div class="card"><div class="rowbetween"><h3>تاریخچه</h3><button id="clearHist" class="btn ghost">پاک کردن</button></div><div id="hist"></div></div></section>
</div>
<dialog id="dlg"><div class="rowbetween"><h3>شواهد داده‌ای</h3><button id="closeDlg" class="btn ghost">بستن</button></div><div id="dlgBody"></div></dialog>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)},fmt=new Intl.NumberFormat("fa-IR");
var stageKeys=["relevance","classification","intent"];
var stageNames={relevance:"مرحله ۱ — Relevance",classification:"مرحله ۲ — Phrase Classification / Concept Grouping",intent:"مرحله ۳ — Intent / Primary / Importance"};
var providers={openrouter:{label:"OpenRouter",endpoint:"https://openrouter.ai/api/v1"},custom:{label:"OpenAI-compatible",endpoint:""}};
var defaults={
relevance:"تو فقط برچسب معنایی می‌زنی. از context_top_queries هویت غالب URL را بفهم. برای هر ID دقیقاً Relevant یا Adjacent یا Irrelevant بده. هیچ ID جدید نساز و هیچ metricی تولید نکن. فقط JSON با شکل {\"items\":[{\"id\":\"q1\",\"label\":\"Relevant\",\"reason\":\"...\",\"confidence\":0.9}]} برگردان.",
classification:"تو فقط Phraseهای از پیش محاسبه‌شده را طبقه‌بندی و در Conceptها گروه‌بندی می‌کنی. type فقط یکی از allowed_types باشد. هیچ Phrase یا metric جدید نساز. همه IDها دقیقاً یک‌بار. فقط JSON: {\"items\":[{\"id\":\"p1\",\"type\":\"Core Entity\",\"concept_key\":\"...\",\"confidence\":0.9}]}",
intent:"فقط از query_id و concept_keyهای ورودی انتخاب کن. یک primary_query_id، حداکثر سه variant_query_ids، main_intent و برای همه conceptها یکی از Core/Important/Secondary/Conditional بده. Opportunity را در نظر نگیر. فقط JSON: {\"main_intent\":\"...\",\"primary_query_id\":\"q1\",\"variant_query_ids\":[],\"concept_importance\":[{\"concept_key\":\"...\",\"importance\":\"Core\"}]}"
};
var allowedTypes=["Core Entity","Semantic Concept","Temporal Qualifier","Modifier","Brand","Product / Model Entity","Location","Content Format","Action / Sub-intent","Question Pattern"];
var allowedImp=["Core","Important","Secondary","Conditional"];
var settings=loadSettings(),keys={relevance:"",classification:"",intent:""},models={relevance:[],classification:[],intent:[]},file=null,demo=false,currentEngine=null,currentAnalysis=null;
var pdefs=[["validation","Validation"],["normalization","Normalization"],["exact","Exact metrics"],["ngrams","N-gram"],["candidates","Candidates"],["rel","AI Relevance"],["class","AI Classification"],["concept","Concept Aggregation"],["intent","AI Intent/Primary"],["select","Carrier/Representative"],["final","Final Validation"]],pstate={};

function baseSettings(){var s={candidateLimit:140,ngramCap:15,stages:{}};stageKeys.forEach(function(k){s.stages[k]={provider:"openrouter",endpoint:providers.openrouter.endpoint,model:"",prompt:defaults[k],timeout:120000,temp:0}});return s}
function loadSettings(){try{var b=baseSettings(),x=JSON.parse(localStorage.getItem("ski-gh-settings")||"null");if(!x)return b;b.candidateLimit=Number(x.candidateLimit)||140;b.ngramCap=Math.min(15,Math.max(1,Number(x.ngramCap)||15));stageKeys.forEach(function(k){b.stages[k]=Object.assign({},b.stages[k],x.stages&&x.stages[k]||{})});return b}catch(e){return baseSettings()}}
function saveSettings(){localStorage.setItem("ski-gh-settings",JSON.stringify(settings))}
function esc(s){return String(s==null?"":s).replace(/[&<>'"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]})}
function error(code,msg){$("err").className="err on";$("err").textContent=code+"\n"+(msg||"")}
function clearError(){$("err").className="err";$("err").textContent=""}
function ce(code,msg){var e=new Error(msg);e.code=code;return e}
function resetPipe(){pstate={};pdefs.forEach(function(x){pstate[x[0]]={s:"idle",m:""}});renderPipe()}
function report(id,s,m){pstate[id]={s:s,m:m||""};renderPipe()}
function renderPipe(){$("pipe").innerHTML=pdefs.map(function(x){var st=pstate[x[0]]||{s:"idle",m:""};return '<div class="row '+st.s+'"><span class="dot"></span><span>'+x[1]+'</span><span class="mini">'+esc(st.m||st.s)+'</span></div>'}).join("")}

function norm(v){var s=String(v==null?"":v).normalize("NFKC").toLowerCase();s=s.replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/[\\u064B-\\u065F\\u0670\\u0640]/g,"");var ar="٠١٢٣٤٥٦٧٨٩",fa="۰۱۲۳۴۵۶۷۸۹";s=s.replace(/[٠-٩]/g,function(d){return String(ar.indexOf(d))}).replace(/[۰-۹]/g,function(d){return String(fa.indexOf(d))});s=s.replace(/[\\u200B-\\u200F\\uFEFF]/g," ").replace(/[،؛؟.,;:!?()[\\]{}"'«»\\-_/\\\\|+*]/g," ");return s.replace(/\\s+/g," ").trim()}
function num(v){if(v==null||v==="")return null;if(typeof v==="number")return Number.isFinite(v)?v:null;var n=Number(norm(v).replace(/[,%\\s]/g,""));return Number.isFinite(n)?n:null}
var al={q:["query","top queries","queries","search query","کوئری","پرس و جو","عبارت","جستجو"],i:["impressions","impression","نمایش","نمایش ها","ایمپرشن"],c:["clicks","click","کلیک","کلیک ها"],p:["position","avg position","average position","موقعیت","جایگاه","رتبه"],pg:["page","top pages","pages","url","آدرس","صفحه"]};
function fc(h,a){var i=h.findIndex(function(x){return a.indexOf(x)>=0});if(i>=0)return i;return h.findIndex(function(x){return a.some(function(y){return x.indexOf(y)>=0})})}
function grid(wb,kind){for(var n=0;n<wb.SheetNames.length;n++){var name=wb.SheetNames[n],mx=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,blankrows:false,raw:true});for(var r=0;r<Math.min(mx.length,10);r++){var h=(mx[r]||[]).map(norm);if(fc(h,al[kind])>=0)return {name:name,mx:mx,row:r,h:h}}}return null}
async function parseXlsx(f){if(!window.XLSX)throw ce("ERROR_XLSX","کتابخانه XLSX لود نشده");var wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),g=grid(wb,"q");if(!g)throw ce("ERROR_MISSING_QUERY_COLUMN","ستون Query پیدا نشد");var qi=fc(g.h,al.q),ii=fc(g.h,al.i),ci=fc(g.h,al.c),pi=fc(g.h,al.p);if(ii<0)throw ce("ERROR_MISSING_IMPRESSIONS_COLUMN","ستون Impressions پیدا نشد");var rows=[];g.mx.slice(g.row+1).forEach(function(r){var q=String(r[qi]||"").trim(),im=num(r[ii]);if(q&&im&&im>0)rows.push({query:q,impressions:im,clicks:ci>=0?(num(r[ci])||0):0,position:pi>=0?num(r[pi]):null})});if(!rows.length)throw ce("ERROR_NO_VALID_ROWS","ردیف معتبر پیدا نشد");var total=null,pg=grid(wb,"pg");if(pg){var ui=fc(pg.h,al.pg),vi=fc(pg.h,al.i),rr=pg.mx.slice(pg.row+1).filter(function(r){return String(r[ui]||"").trim()});if(rr.length===1&&vi>=0)total=num(rr[0][vi])}return {rows:rows,total:total}}
function agg(raw){var m=new Map();raw.forEach(function(r){var n=norm(r.query);if(!n)return;var a=m.get(n);if(!a){a={raw:r.query,normalized:n,clicks:0,impressions:0,pn:0,pd:0,merged:new Set(),tokens:n.split(" ")};m.set(n,a)}a.clicks+=r.clicks||0;a.impressions+=r.impressions;a.merged.add(r.query);if(Number.isFinite(r.position)){a.pn+=r.position*r.impressions;a.pd+=r.impressions}});return Array.from(m.values()).sort(function(a,b){return b.impressions-a.impressions}).map(function(a,i){return {id:"q"+(i+1),raw:a.raw,normalized:a.normalized,clicks:a.clicks,impressions:a.impressions,position:a.pd?a.pn/a.pd:0,ctr:a.impressions?a.clicks/a.impressions:0,tokens:a.tokens,mergedFrom:Array.from(a.merged)}})}
function phrases(qs,cap){var m=new Map(),total=qs.reduce(function(s,q){return s+q.impressions},0)||1;qs.forEach(function(q){var seen=new Set(),mx=Math.min(cap,q.tokens.length);for(var n=1;n<=mx;n++)for(var i=0;i<=q.tokens.length-n;i++)seen.add(q.tokens.slice(i,i+n).join(" "));seen.forEach(function(t){var p=m.get(t);if(!p){p={text:t,n:t.split(" ").length,queryIds:[],queryCount:0,includedImpressions:0,top:0};m.set(t,p)}p.queryIds.push(q.id);p.queryCount++;p.includedImpressions+=q.impressions;p.top=Math.max(p.top,q.impressions)})});return Array.from(m.values()).sort(function(a,b){return b.includedImpressions-a.includedImpressions||b.n-a.n}).map(function(p,i){p.id="p"+(i+1);p.coverage=p.includedImpressions/total;p.concentration=p.top/p.includedImpressions;return p})}
function cand(ps,limit,total){var min=Math.max(5,total*.001);return ps.filter(function(p){return p.includedImpressions>=min&&(p.n===1||p.queryCount>1||p.includedImpressions>=total*.01)}).slice(0,limit)}
function demoRows(){return [["قیمت بیمه شخص ثالث ۱۴۰۵",100,4200,3.1],["قیمت بیمه شخص ثالث 1405",40,1400,3.4],["جدول نرخ بیمه شخص ثالث ۱۴۰۵ بیمه ایران",90,3100,2.3],["هزینه بیمه شخص ثالث ۱۴۰۵",35,1800,5.2],["نرخ بیمه شخص ثالث ۱۴۰۵",28,1500,5.8],["قیمت بیمه شخص ثالث پراید ۱۴۰۵",25,1200,2.1],["قیمت بیمه بدنه ۱۴۰۵",12,500,8.2]].map(function(x){return {query:x[0],clicks:x[1],impressions:x[2],position:x[3]}})}
async function engine(src){report("validation","running");var parsed,name;if(src==="demo"){parsed={rows:demoRows(),total:17000};name="DEMO"}else{parsed=await parseXlsx(file);name=file.name}report("validation","done",parsed.rows.length+" row");report("normalization","running");var qs=agg(parsed.rows);report("normalization","done",qs.length+" unique");var vi=qs.reduce(function(s,q){return s+q.impressions},0),vc=qs.reduce(function(s,q){return s+q.clicks},0);report("exact","done",fmt.format(vi));report("ngrams","running");var ps=phrases(qs,settings.ngramCap);report("ngrams","done",ps.length+" phrase");report("candidates","running");var cs=cand(ps,settings.candidateLimit,vi);report("candidates","done",cs.length+" candidate");return {name:name,queries:qs,phrases:ps,candidates:cs,summary:{valid:qs.length,visible:vi,clicks:vc,total:parsed.total,coverage:parsed.total?vi/parsed.total*100:null,max:Math.max.apply(null,qs.map(function(q){return q.tokens.length}))}}}

async function getModels(stage){var c=settings.stages[stage],base=(c.endpoint||providers[c.provider].endpoint||"").replace(/\\/$/,""),k=keys[stage].trim(),url=base+"/models",h={};if(k)h.Authorization="Bearer "+k;var r;try{r=await fetch(url,{headers:h})}catch(e){throw ce("ERROR_MODEL_LIST_UNAVAILABLE",e.message)}if(!r.ok)throw ce("ERROR_MODEL_LIST_UNAVAILABLE",r.status+": "+(await r.text()).slice(0,180));var j=await r.json(),a=(j.data||[]).map(function(x){return {id:x.id,name:x.name||x.id}});if(!a.length)throw ce("ERROR_MODEL_LIST_UNAVAILABLE","مدلی دریافت نشد");models[stage]=a.sort(function(a,b){return a.name.localeCompare(b.name)});renderSettings()}
async function ai(stage,payload){var c=settings.stages[stage],k=keys[stage].trim(),base=(c.endpoint||providers[c.provider].endpoint||"").replace(/\\/$/,"");if(!k||!c.model.trim()||!base)throw ce("AI_NOT_CONFIGURED","تنظیمات "+stageNames[stage]+" کامل نیست");var ctrl=new AbortController(),tm=setTimeout(function(){ctrl.abort()},c.timeout||120000),h={"content-type":"application/json",Authorization:"Bearer "+k};if(c.provider==="openrouter"){h["HTTP-Referer"]=location.href;h["X-Title"]="SEO Keyword Intelligence"}try{var r=await fetch(base+"/chat/completions",{method:"POST",headers:h,signal:ctrl.signal,body:JSON.stringify({model:c.model,temperature:c.temp||0,response_format:{type:"json_object"},messages:[{role:"system",content:c.prompt},{role:"user",content:JSON.stringify(payload)}]})});if(!r.ok)throw ce("ERROR_PROVIDER_UNAVAILABLE",r.status+": "+(await r.text()).slice(0,260));var j=await r.json(),t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!t)throw ce("ERROR_AI_INVALID_RESPONSE","پاسخ خالی");try{return JSON.parse(String(t).trim())}catch(e){throw ce("ERROR_AI_INVALID_RESPONSE","JSON نامعتبر")}}finally{clearTimeout(tm)}}
function exactIds(items,allowed,label){if(!Array.isArray(items))throw ce("ERROR_AI_INVALID_RESPONSE",label+" items");var seen=new Set();items.forEach(function(x){if(!allowed.has(x.id))throw ce("ERROR_AI_UNKNOWN_ID",label+" "+x.id);if(seen.has(x.id))throw ce("ERROR_AI_INVALID_RESPONSE","ID تکراری");seen.add(x.id)});if(seen.size!==allowed.size)throw ce("ERROR_AI_MISSING_IDS",label+" همه IDها برنگشتند")}
async function relevance(e){report("rel","running");var out={},ctx=e.queries.slice(0,25).map(function(q){return {id:q.id,query:q.normalized,impressions:q.impressions,position:+q.position.toFixed(2)}});for(var i=0;i<e.queries.length;i+=80){var b=e.queries.slice(i,i+80),j=await ai("relevance",{task:"relevance",context_top_queries:ctx,queries:b.map(function(q){return {id:q.id,query:q.normalized,impressions:q.impressions,position:+q.position.toFixed(2)}})}),allow=new Set(b.map(function(q){return q.id}));exactIds(j.items,allow,"relevance");j.items.forEach(function(x){if(["Relevant","Adjacent","Irrelevant"].indexOf(x.label)<0)throw ce("ERROR_AI_INVALID_RESPONSE","label");out[x.id]=x})}report("rel","done");return out}
function has(q,p){return (" "+q+" ").indexOf(" "+p+" ")>=0}
async function classify(e,rel){report("class","running");var rq=e.queries.filter(function(q){return rel[q.id]&&rel[q.id].label==="Relevant"}),rp=phrases(rq,settings.ngramCap),cc=cand(rp,settings.candidateLimit,rq.reduce(function(s,q){return s+q.impressions},0));var j=await ai("classification",{task:"phrase_classification",allowed_types:allowedTypes,phrases:cc.map(function(p){return {id:p.id,phrase:p.text,n:p.n,query_count:p.queryCount,included_impressions:p.includedImpressions,concentration:+p.concentration.toFixed(3),sample_queries:rq.filter(function(q){return has(q.normalized,p.text)}).slice(0,3).map(function(q){return q.normalized})}})}),allow=new Set(cc.map(function(p){return p.id}));exactIds(j.items,allow,"classification");var map={};j.items.forEach(function(x){if(allowedTypes.indexOf(x.type)<0||!x.concept_key)throw ce("ERROR_AI_INVALID_RESPONSE","classification schema");map[x.id]=x});report("class","done",cc.length+" phrase");return {rq:rq,rp:rp,cc:cc,map:map}}
function concepts(cd,imp){var pmap=new Map(cd.rp.map(function(p){return [p.id,p]})),groups=new Map();Object.keys(cd.map).forEach(function(id){var c=cd.map[id],g=groups.get(c.concept_key);if(!g){g={key:c.concept_key,type:c.type,ps:[],importance:imp&&imp[c.concept_key]||"Secondary"};groups.set(c.concept_key,g)}var p=pmap.get(id);if(p)g.ps.push(p)});var total=cd.rq.reduce(function(s,q){return s+q.impressions},0)||1,res=[];groups.forEach(function(g){var qids=[],sum=0;cd.rq.forEach(function(q){if(g.ps.some(function(p){return has(q.normalized,p.text)})){qids.push(q.id);sum+=q.impressions}});var words=g.ps.map(function(p){return {text:p.text,impressions:p.includedImpressions,count:p.queryCount}}).sort(function(a,b){return b.impressions-a.impressions}),carrier=cd.rq.filter(function(q){return qids.indexOf(q.id)>=0}).sort(function(a,b){return b.impressions-a.impressions||a.tokens.length-b.tokens.length})[0];res.push({key:g.key,type:g.type,importance:g.importance,qids:qids,count:qids.length,impressions:sum,share:sum/total*100,words:words,carrier:carrier&&carrier.id})});return res.sort(function(a,b){return b.impressions-a.impressions})}
async function intent(e,rel,cd){report("concept","running");var pre=concepts(cd,null);if(!pre.length)throw ce("REVIEW_REQUIRED_CONCEPT_GROUPING","Concept ساخته نشد");report("concept","done",pre.length+" concept");report("intent","running");var qc=cd.rq.slice(0,55);if(qc.length<3)throw ce("INSUFFICIENT_DATA_FOR_PRIMARY_KEYWORD","Query کافی نیست");var j=await ai("intent",{task:"intent_primary_variants_importance",allowed_importance:allowedImp,query_candidates:qc.map(function(q){return {id:q.id,query:q.normalized,impressions:q.impressions,position:+q.position.toFixed(2),token_count:q.tokens.length}}),concepts:pre.map(function(c){return {concept_key:c.key,type:c.type,query_count:c.count,impressions:c.impressions,coverage_percent:+c.share.toFixed(1),wordings:c.words.slice(0,4).map(function(w){return w.text})}})}),qids=new Set(qc.map(function(q){return q.id}));if(!qids.has(j.primary_query_id))throw ce("ERROR_AI_UNKNOWN_QUERY_ID","Primary");var vars=Array.from(new Set(j.variant_query_ids||[])).filter(function(x){return x!==j.primary_query_id});if(vars.length>3||vars.some(function(x){return !qids.has(x)}))throw ce("ERROR_AI_INVALID_RESPONSE","Variants");var cset=new Set(pre.map(function(c){return c.key})),items=(j.concept_importance||[]).map(function(x){return {id:x.concept_key,importance:x.importance}});exactIds(items,cset,"importance");var im={};(j.concept_importance||[]).forEach(function(x){if(allowedImp.indexOf(x.importance)<0)throw ce("ERROR_AI_INVALID_RESPONSE","importance");im[x.concept_key]=x.importance});report("intent","done",j.main_intent||"");return {j:j,vars:vars,cs:concepts(cd,im)}}
function reps(e,cd,it){report("select","running");var important=it.cs.filter(function(c){return c.importance==="Core"||c.importance==="Important"}),sel=[it.j.primary_query_id],covered=new Set(),exclude=new Set([it.j.primary_query_id].concat(it.vars));function mark(id){important.forEach(function(c){if(c.qids.indexOf(id)>=0)covered.add(c.key)})}mark(sel[0]);while(sel.length<3){var best=null,score=-1;cd.rq.forEach(function(q){if(sel.indexOf(q.id)>=0||exclude.has(q.id))return;var s=Math.log10(q.impressions+10)*.2;important.forEach(function(c){if(!covered.has(c.key)&&c.qids.indexOf(q.id)>=0)s+=(c.importance==="Core"?4:2)*Math.log10(c.impressions+10)});if(s>score){score=s;best=q}});if(!best)break;sel.push(best.id);mark(best.id)}cd.rq.forEach(function(q){if(sel.length<3&&sel.indexOf(q.id)<0&&!exclude.has(q.id))sel.push(q.id)});report("select","done",sel.length+" query");return sel.slice(0,3)}

async function run(mode,src){clearError();resetPipe();$("out").innerHTML="";try{currentEngine=await engine(src);if(mode==="data"){["rel","class","concept","intent","select","final"].forEach(function(x){report(x,"skip","Data only")});renderData(currentEngine);hist("data",currentEngine,null);return}var r=await relevance(currentEngine),cd=await classify(currentEngine,r),it=await intent(currentEngine,r,cd),rr=reps(currentEngine,cd,it);report("final","running");if(rr.length!==3)throw ce("REVIEW_REQUIRED_REPRESENTATIVE_QUERIES","سه Query نماینده پیدا نشد");report("final","done","OK");currentAnalysis={rel:r,cd:cd,it:it,reps:rr};renderFull(currentEngine,currentAnalysis);hist("full",currentEngine,currentAnalysis)}catch(e){error(e.code||"ERROR",e.message||String(e));var x=pdefs.find(function(z){return pstate[z[0]]&&pstate[z[0]].s==="running"});if(x)report(x[0],"error",e.code||"ERROR")}}
function metrics(e){var s=e.summary;return '<div class="metric"><div>Query معتبر<b>'+fmt.format(s.valid)+'</b></div><div>Visible Impressions<b>'+fmt.format(s.visible)+'</b></div><div>Page Impressions<b>'+(s.total?fmt.format(s.total):"—")+'</b></div><div>Visible Coverage<b>'+(s.coverage!=null?s.coverage.toFixed(1)+"٪":"—")+'</b></div></div>'}
function qtable(qs){return '<div class="tbl"><table><thead><tr><th>Query</th><th>Impressions</th><th>Position</th><th>Clicks</th></tr></thead><tbody>'+qs.map(function(q){return '<tr><td>'+esc(q.normalized)+'</td><td>'+fmt.format(q.impressions)+'</td><td>'+q.position.toFixed(2)+'</td><td>'+fmt.format(q.clicks)+'</td></tr>'}).join("")+'</tbody></table></div>'}
function ptable(ps){return '<div class="tbl"><table><thead><tr><th>Phrase</th><th>n</th><th>Query Count</th><th>Included Impressions</th><th>Concentration</th></tr></thead><tbody>'+ps.map(function(p){return '<tr><td>'+esc(p.text)+'</td><td>'+p.n+'</td><td>'+p.queryCount+'</td><td>'+fmt.format(p.includedImpressions)+'</td><td>'+(p.concentration*100).toFixed(1)+'٪</td></tr>'}).join("")+'</tbody></table></div>'}
function renderData(e){$("out").innerHTML='<h2 class="section">Dataset Summary</h2><div class="card">'+metrics(e)+'<div class="ok">Data Engine کامل اجرا شد؛ بخش معنایی بدون AI عمداً اجرا نشد.</div></div><h2 class="section">Top Queries</h2>'+qtable(e.queries.slice(0,30))+'<h2 class="section">Top Included Phrases</h2>'+ptable(e.candidates.slice(0,35))}
function ctable(cs){return '<div class="tbl"><table><thead><tr><th>Concept</th><th>Type</th><th>Importance</th><th>Query Count</th><th>Coverage</th><th>Share</th></tr></thead><tbody>'+cs.map(function(c){return '<tr><td>'+esc(c.key)+'</td><td>'+esc(c.type)+'</td><td class="'+c.importance+'">'+c.importance+'</td><td>'+c.count+'</td><td>'+fmt.format(c.impressions)+'</td><td>'+c.share.toFixed(1)+'٪</td></tr>'}).join("")+'</tbody></table></div>'}
function renderFull(e,a){var qm=new Map(e.queries.map(function(q){return [q.id,q]})),p=qm.get(a.it.j.primary_query_id),vs=a.it.vars.map(function(id){return qm.get(id)}).filter(Boolean),rs=a.reps.map(function(id){return qm.get(id)}).filter(Boolean),important=a.it.cs.filter(function(c){return c.importance==="Core"||c.importance==="Important"});$("out").innerHTML='<h2 class="section">1. Dataset Summary</h2><div class="card">'+metrics(e)+'</div><h2 class="section">2. Main Search Intent</h2><div class="card"><b>'+esc(a.it.j.main_intent)+'</b></div><h2 class="section">3. Primary Keyword</h2><div class="card"><h3>'+esc(p&&p.normalized||"—")+'</h3><div class="mini">Exact Impressions: '+fmt.format(p&&p.impressions||0)+' | Position: '+(p?p.position.toFixed(2):"—")+'</div></div><h2 class="section">4. Mandatory Variants</h2>'+qtable(vs)+'<h2 class="section">5. Core Concepts & Entities</h2>'+ctable(a.it.cs)+'<h2 class="section">6. Preferred Wording</h2><div class="card">'+important.map(function(c){return '<p><b>'+esc(c.key)+':</b> '+c.words.slice(0,5).map(function(w,i){return '<span class="pill">'+(i===0?"★ ":"")+esc(w.text)+" — "+fmt.format(w.impressions)+'</span>'}).join("")+'</p>'}).join("")+'</div><h2 class="section">7. Carrier Query Map</h2><div class="tbl"><table><thead><tr><th>Concept</th><th>Carrier Query</th><th>Impressions</th></tr></thead><tbody>'+important.map(function(c){var q=qm.get(c.carrier);return '<tr><td>'+esc(c.key)+'</td><td>'+esc(q&&q.normalized||"—")+'</td><td>'+fmt.format(q&&q.impressions||0)+'</td></tr>'}).join("")+'</tbody></table></div><h2 class="section">8. Important Included Phrases</h2>'+ptable(a.cd.rp.slice(0,30))+'<h2 class="section">9. Representative Demand Queries</h2>'+qtable(rs)+'<h2 class="section">10. Final Keyword Importance Brief</h2><div class="card"><p><b>Primary:</b> '+esc(p&&p.normalized||"—")+'</p><p><b>Variants:</b> '+(vs.map(function(q){return esc(q.normalized)}).join("، ")||"—")+'</p><p><b>Core/Important Concepts:</b> '+important.map(function(c){return esc(c.key)}).join("، ")+'</p><p><b>3 Representative Queries:</b> '+rs.map(function(q){return esc(q.normalized)}).join(" | ")+'</p><div class="mini">این خروجی فقط Keyword Importance است؛ نه Execution، نه SEO Opportunity و نه پیشنهاد صفحه جدید.</div></div>'}

function renderSettings(){$("cand").value=settings.candidateLimit;$("ngcap").value=settings.ngramCap;$("stageSettings").innerHTML=stageKeys.map(function(s){var c=settings.stages[s],ms=models[s]||[];return '<div class="card stagebox"><div class="rowbetween"><h3>'+stageNames[s]+'</h3><button class="btn ghost" data-copy="'+s+'">اعمال همین Provider / مدل / کلید برای هر ۳ مرحله</button></div><div class="grid g3"><label>Provider<select data-prov="'+s+'">'+Object.keys(providers).map(function(id){return '<option value="'+id+'" '+(c.provider===id?"selected":"")+'>'+providers[id].label+'</option>'}).join("")+'</select></label><label>Endpoint<input data-endpoint="'+s+'" value="'+esc(c.endpoint)+'" dir="ltr"></label><label>API Key (فقط حافظه نشست)<input data-key="'+s+'" type="password" value="'+esc(keys[s])+'" dir="ltr" placeholder="sk-or-..."></label></div><div class="mini">'+(c.provider==="openrouter"?"کلید OpenRouter معمولاً با sk-or- شروع می‌شود. مدل‌ها مستقیماً از OpenRouter خوانده می‌شوند.":"")+'</div><div class="grid g2"><div><div class="actions"><button class="btn green" data-load="'+s+'">بارگذاری/به‌روزرسانی مدل‌ها</button></div><input data-search="'+s+'" placeholder="جست‌وجوی مدل..."><div class="modelbox">'+(ms.length?ms.slice(0,120).map(function(m){return '<div class="model" data-pick="'+s+'" data-mid="'+esc(m.id)+'"><b>'+esc(m.name)+'</b><div class="mini">'+esc(m.id)+'</div></div>'}).join(""):'<div class="mini" style="padding:10px">مدل‌ها هنوز بارگذاری نشده‌اند.</div>')+'</div></div><div><label>Model ID<input data-model="'+s+'" value="'+esc(c.model)+'" dir="ltr" placeholder="provider/model"></label><label>Timeout<input data-timeout="'+s+'" type="number" value="'+c.timeout+'"></label><label>Temperature<input data-temp="'+s+'" type="number" step="0.1" min="0" max="2" value="'+c.temp+'"></label><div class="mini" data-merr="'+s+'"></div></div></div><label style="margin-top:12px">Custom Prompt<textarea data-prompt="'+s+'">'+esc(c.prompt)+'</textarea></label><button class function bindSettings(){document.querySelectorAll("[data-prov]").forEach(function(el){el.onchange=function(){var s=el.dataset.prov,p=el.value;settings.stages[s].provider=p;settings.stages[s].endpoint=providers[p].endpoint;settings.stages[s].model="";models[s]=[];renderSettings()}});document.querySelectorAll("[data-endpoint]").forEach(function(el){el.oninput=function(){settings.stages[el.dataset.endpoint].endpoint=el.value}});document.querySelectorAll("[data-key]").forEach(function(el){el.oninput=function(){keys[el.dataset.key]=el.value}});document.querySelectorAll("[data-model]").forEach(function(el){el.oninput=function(){settings.stages[el.dataset.model].model=el.value}});document.querySelectorAll("[data-timeout]").forEach(function(el){el.oninput=function(){settings.stages[el.dataset.timeout].timeout=Number(el.value)||120000}});document.querySelectorAll("[data-temp]").forEach(function(el){el.oninput=function(){settings.stages[el.dataset.temp].temp=Number(el.value)||0}});document.querySelectorAll("[data-prompt]").forEach(function(el){el.oninput=function(){settings.stages[el.dataset.prompt].prompt=el.value}});document.querySelectorAll("[data-reset]").forEach(function(el){el.onclick=function(){settings.stages[el.dataset.reset].prompt=defaults[el.dataset.reset];renderSettings()}});document.querySelectorAll("[data-load]").forEach(function(el){el.onclick=async function(){var s=el.dataset.load,box=document.querySelector('[data-merr="'+s+'"]');box.textContent="در حال دریافت...";try{await getModels(s);document.querySelector('[data-merr="'+s+'"]').textContent=models[s].length+" مدل واقعی دریافت شد"}catch(e){document.querySelector('[data-merr="'+s+'"]').textContent=(e.code||"ERROR_MODEL_LIST_UNAVAILABLE")+": "+e.message}}});document.querySelectorAll("[data-pick]").forEach(function(el){el.onclick=function(){settings.stages[el.dataset.pick].model=el.dataset.mid;renderSettings()}});document.querySelectorAll("[data-search]").forEach(function(el){el.oninput=function(){var s=el.dataset.search,q=el.value.toLowerCase();document.querySelectorAll('[data-pick="'+s+'"]').forEach(function(x){x.style.display=x.textContent.toLowerCase().indexOf(q)>=0?"block":"none"})}});document.querySelectorAll("[data-copy]").forEach(function(el){el.onclick=function(){var s=el.dataset.copy,src=settings.stages[s];stageKeys.forEach(function(t){settings.stages[t]=Object.assign({},settings.stages[t],{provider:src.provider,endpoint:src.endpoint,model:src.model,timeout:src.timeout,temp:src.temp});keys[t]=keys[s];models[t]=(models[s]||[]).slice()});renderSettings()}})}
